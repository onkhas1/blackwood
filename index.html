<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="After Dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<title>After Dark</title>
<script>if (/tgWebApp/.test(location.hash + location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" aria-label="After Dark">
  <div id="scene">
    <div id="bg" class="bg"></div>
    <div id="bg2" class="bg"></div>
    <canvas id="rain" aria-hidden="true"></canvas>
    <div id="sprite-wrap" aria-hidden="true"><img id="sprite" alt=""></div>
    <div id="flash" aria-hidden="true"></div>
  </div>
  <div id="pulse" aria-hidden="true"></div>
  <div id="chill" aria-hidden="true"></div>

  <section id="box" hidden>
    <p id="who"></p>
    <p id="text"></p>
    <svg id="next" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </section>

  <section id="choices" hidden></section>
  <p id="sr" class="sr" aria-live="polite"></p>

  <form id="nameForm" hidden autocomplete="off">
    <label for="nameInput">Как тебя зовут?</label>
    <input id="nameInput" name="heroine-name" maxlength="16" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Твоё имя…">
    <button type="submit" disabled>Так и зови</button>
  </form>

  <article id="letter" hidden></article>

  <section id="chapter" hidden><small></small><h2></h2><p></p></section>
  <p id="memo" aria-live="polite"></p>

  <button id="exit" type="button" aria-label="В меню">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <section id="menu" hidden>
    <header class="bar">
      <div class="bar-row">
        <p class="brand" id="brand" aria-label="After Dark"><span aria-hidden="true">After</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 2.6a9.6 9.6 0 1 0 6.3 14.6 8 8 0 0 1-6.3-14.6z"/></svg><span aria-hidden="true">Dark</span></p>
        <div class="wallet">
          <button type="button" class="chip" id="energyChip" aria-label="Энергия. Пополнить">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/></svg>
            <span id="energyNum"></span>
            <svg class="add" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
          </button>
          <button type="button" class="chip" id="coinChip" aria-label="Монеты. Пополнить">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/></svg>
            <span id="coinNum"></span>
            <svg class="add" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
          </button>
        </div>
      </div>
      <p class="regen" id="regen"></p>
    </header>

    <div class="body">
      <div id="stories">
        <h2 class="section">Истории</h2>
        <div id="list"></div>
        <p class="soon">Скоро здесь будут новые истории.</p>
      </div>

      <article id="detail" hidden>
        <button type="button" class="back" id="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Все истории
        </button>
        <div class="cover big" id="detailCover"></div>
        <h1 id="detailTitle"></h1>
        <p class="where" id="detailWhere"></p>
        <p class="desc" id="detailDesc"></p>
        <div class="actions">
          <button type="button" class="primary" id="mainAct"></button>
          <p class="note" id="actNote" hidden></p>
          <button type="button" class="quiet" id="restart" hidden></button>
        </div>
      </article>
      <small id="ver">сборка 20</small>
    </div>
  </section>

  <div id="sheet" hidden>
    <button type="button" class="scrim" id="scrim" aria-label="Закрыть"></button>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Магазин пока закрыт</h2>
      <p>Игра бесплатная, покупать пока нечего.</p>
      <p>Одна глава стоит <b id="sheetCost"></b> энергии. Каждые 10 минут капает 1, пока не наберётся <b id="sheetCap"></b>.</p>
      <form id="promo" autocomplete="off" novalidate>
        <label for="promoInput">Есть промокод?</label>
        <div class="row">
          <input id="promoInput" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="32" placeholder="Введи код">
          <button type="submit" id="promoBtn" disabled>Применить</button>
        </div>
        <p id="promoMsg" role="status"></p>
      </form>
      <button type="button" class="quiet" id="sheetClose">Закрыть</button>
    </section>
  </div>
</main>
<script src="store.js"></script>
<script src="story.js"></script>
<script src="story-2.js"></script>
<script src="game.js"></script>
<script src="menu.js"></script>
</body>
</html>
