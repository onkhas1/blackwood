<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Блэквуд">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<title>Блэквуд</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" aria-label="Блэквуд, эпизод 1">
  <div id="scene">
    <div id="bg" class="bg"></div>
    <div id="bg2" class="bg"></div>
    <canvas id="rain" aria-hidden="true"></canvas>
    <div id="sprite-wrap" aria-hidden="true"><img id="sprite" alt=""></div>
    <div id="flash" aria-hidden="true"></div>
  </div>
  <div id="pulse" aria-hidden="true"></div>
  <div id="chill" aria-hidden="true"></div>

  <section id="box" hidden>
    <p id="who"></p>
    <p id="text"></p>
    <svg id="next" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </section>

  <section id="choices" hidden></section>
  <p id="sr" class="sr" aria-live="polite"></p>

  <form id="nameForm" hidden autocomplete="off">
    <label for="nameInput">Как тебя зовут?</label>
    <input id="nameInput" name="heroine-name" maxlength="16" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Твоё имя…">
    <button type="submit" disabled>Так и зови</button>
  </form>

  <article id="letter" hidden></article>

  <section id="title">
    <h1>Блэквуд</h1>
    <p>Эпизод 1. Приезд</p>
    <button id="start">Начать</button>
    <button id="restart" class="quiet" hidden>Начать сначала</button>
    <small id="ver">сборка 12</small>
  </section>
</main>
<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
